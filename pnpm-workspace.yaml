# pnpm 11+ moved settings out of package.json's "pnpm" block.
# esbuild / sharp / workerd ship native postinstall scripts that
# wrangler / vitest / workers require — allow them explicitly.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# Supply-chain wait for newly published versions, in minutes (3 days).
# Renovate already holds updates for 7 days, so its lockfile bumps resolve
# to versions older than this.
minimumReleaseAge: 4320
