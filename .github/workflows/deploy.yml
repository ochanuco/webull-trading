name: deploy
run-name: deploy webull-trading @ ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: デプロイする ref（main、または main 上のコミット SHA）
        required: true
        default: main

permissions:
  contents: read

jobs:
  deploy:
    uses: ochanuco/.github/.github/workflows/deploy.yml@ddb8e656d5e975d255c122b0090df4efcb7a5cae # v1.8.0
    with:
      ref: ${{ inputs.ref }}
      op-env-file: .github/deploy/production.env.op
      run: scripts/deploy.sh production
    secrets: inherit
