name: deploy
run-name: deploy webull-trading @ ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: デプロイする ref（main、または main 上のコミット SHA）
        required: true
        default: main

permissions:
  contents: read

jobs:
  deploy:
    uses: ochanuco/.github/.github/workflows/deploy.yml@737e6affb5e43803670afb13376dded4731e3388 # v1.5.0
    with:
      ref: ${{ inputs.ref }}
      op-env-file: .github/deploy/production.env.op
      run: scripts/deploy.sh production
    secrets: inherit
