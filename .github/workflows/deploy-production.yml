name: deploy-production

# 本番への手動 deploy。承認は GitHub の Environment `production` の Required reviewers で行う。
# ロールバックは、戻したい main 上のコミット SHA を ref に指定して実行する。
# 移行期間中は release PR → Workers Builds の経路も残っている (docs/production-cd.md)。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: deploy する ref（main、または main 上のコミット SHA）
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # main を経ていないコミット (レビュー前のブランチ) を本番に出さない
      - name: ref guard
        env:
          REF: ${{ inputs.ref }}
        run: |
          case "$REF" in
            main | refs/heads/main) sha=$(git rev-parse HEAD) ;;
            *)
              if ! sha=$(git rev-parse --verify --quiet "${REF}^{commit}") || ! git merge-base --is-ancestor "$sha" HEAD; then
                echo "error: ref は main か、main 上のコミット SHA のみ指定できる: $REF" >&2
                exit 1
              fi
              ;;
          esac
          git checkout --quiet "$sha"
          echo "deploying \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - name: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/deploy.sh production
