name: production preflight

# production への昇格 PR に付く required check。本番 D1 の binding を確かめ、production 向けの deploy を dry-run する
on:
  pull_request:
    branches: [production]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    uses: ochanuco/.github/.github/workflows/pnpm.yml@f41400013689c51685e10ba1523bfbb576f687dd # v1.0.0
    with:
      run: pnpm run deploy:production:dry-run
      timeout-minutes: 10
