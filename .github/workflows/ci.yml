name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ochanuco/.github/.github/workflows/pnpm.yml@5dc4f2961ad12425cb2b3c6ab38cd52c9b8b6558 # main
