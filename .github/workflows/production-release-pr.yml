name: production release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: production-release-pr
  cancel-in-progress: false

jobs:
  create:
    name: create or update release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Ensure production branch exists
        env:
          PRODUCTION_RELEASE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          remote="https://x-access-token:${PRODUCTION_RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git ls-remote --exit-code --heads "$remote" production >/dev/null; then
            {
              echo "::error::origin/production does not exist."
              echo "Create it intentionally from the current production baseline before enabling Cloudflare Workers Builds."
              echo "Example: git push origin main:production"
            } >&2
            exit 1
          fi

      - name: Update release branch
        env:
          PRODUCTION_RELEASE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          remote="https://x-access-token:${PRODUCTION_RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          remote_release_sha="$(git ls-remote --heads "$remote" release/production | cut -f1)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B release/production origin/main

          push_with_retry() {
            attempt=1
            while [ "$attempt" -le 3 ]; do
              if "$@"; then
                return 0
              fi

              if [ "$attempt" = "3" ]; then
                return 1
              fi

              echo "::notice::git push failed; retrying in $((attempt * 5)) seconds."
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }

          if [ -n "$remote_release_sha" ]; then
            push_with_retry git push --force-with-lease=refs/heads/release/production:"$remote_release_sha" "$remote" release/production:refs/heads/release/production
          else
            push_with_retry git push "$remote" release/production:refs/heads/release/production
          fi

      - name: Check production delta
        id: production_delta
        env:
          PRODUCTION_RELEASE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          remote="https://x-access-token:${PRODUCTION_RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags "$remote" production:refs/remotes/origin/production

          ahead_count="$(git rev-list --count origin/production..release/production)"
          if [ "$ahead_count" = "0" ]; then
            echo "::notice::production is already up to date with main; skipping production release PR creation."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "release/production is $ahead_count commit(s) ahead of production."
          fi

      - name: Create or update production PR
        if: steps.production_delta.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          release_prs="$(
            git log --reverse --pretty=format:%s origin/production..release/production \
              | grep -Eo '#[0-9]+' \
              | awk '!seen[$0]++ { print "- " $0 }'
          )"

          if [ -z "$release_prs" ]; then
            release_prs="- PR 番号を commit message から特定できませんでした"
          fi

          {
            echo "## 概要"
            echo
            echo "\`main\` の現在の内容を \`production\` に昇格するリリースPRです。"
            echo
            echo "このPRは本番昇格の承認ゲートであり、コードの再レビュー用ではありません。通常のコードレビューとCIは \`main\` に入る通常PRで完了済みです。"
            echo
            echo "## リリース対象PR"
            echo
            echo "$release_prs"
            echo
            echo "## Merge前チェック"
            echo
            echo "- [ ] Cloudflare Workers Builds の production branch が \`production\` になっている"
            echo "- [ ] rollback 手順を直近で確認している"
            echo "- [ ] \`/admin/production-readiness\` に \`fail\` がない"
            echo
            echo "## Deploy"
            echo
            echo "このPRを \`production\` に merge すると、Cloudflare Workers Builds が production deploy を開始します。"
          } > release-pr-body.md

          existing="$(gh pr list \
            --base production \
            --head release/production \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file release-pr-body.md
            echo "Updated PR #$existing"
          else
            title="$(TZ=Asia/Tokyo date '+🚀リリース%Y-%m-%d %H:%M:%S')"
            gh pr create --base production --head release/production --title "$title" --body-file release-pr-body.md
          fi

      # production は release マージ毎に merge commit を積んで main と分岐するため、
      # production ルールセットの strict (branch up-to-date 必須) が release PR に
      # 毎回 "Update branch" を要求する。ここで GitHub の update-branch API を自動で
      # 叩いて branch を base 最新に揃え、operator が手で押す手間を無くす。
      # マージ自体は承認ゲートとして手動のまま (本ステップは更新のみ、merge はしない)。
      - name: Auto-update release PR branch (skip manual "Update branch")
        if: steps.production_delta.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pr_number="$(gh pr list \
            --base production \
            --head release/production \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            echo "::notice::no open release PR; nothing to update."
            exit 0
          fi

          # mergeStateStatus が BEHIND の間だけ update-branch を叩く。GitHub の
          # mergeability 計算は非同期なので UNKNOWN は数秒待って再評価。BEHIND 以外
          # (CLEAN / BLOCKED=要レビュー 等) になったら最新化済みとみなして終了。
          attempt=1
          while [ "$attempt" -le 6 ]; do
            state="$(gh pr view "$pr_number" --json mergeStateStatus --jq '.mergeStateStatus' 2>/dev/null || echo UNKNOWN)"
            case "$state" in
              BEHIND)
                echo "::notice::release PR #$pr_number is BEHIND; calling update-branch."
                gh api -X PUT "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/update-branch" >/dev/null 2>&1 || true
                sleep 5
                ;;
              UNKNOWN)
                echo "mergeability still computing; waiting."
                sleep 5
                ;;
              *)
                echo "::notice::release PR #$pr_number not behind (state=$state); branch is up to date."
                exit 0
                ;;
            esac
            attempt=$((attempt + 1))
          done
          echo "::notice::update-branch not confirmed after retries; operator may need to click Update branch once."
