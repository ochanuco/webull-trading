name: production release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    uses: ochanuco/.github/.github/workflows/release-pr.yml@5dc4f2961ad12425cb2b3c6ab38cd52c9b8b6558 # main
    with:
      checklist: |
        - [ ] Cloudflare Workers Builds の production branch が `production` になっている
        - [ ] rollback 手順を直近で確認している
        - [ ] `/admin/production-readiness` に `fail` がない
      deploy-note: このPRを `production` に merge すると、Cloudflare Workers Builds が production deploy を開始します。
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
